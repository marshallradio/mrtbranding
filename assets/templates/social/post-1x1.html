<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: "Source Sans Pro", Arial, sans-serif; }
.post { width: 480px; height: 480px; background: #070A10; color: white; position: relative; overflow: hidden; }
.scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.2), rgba(0,0,0,.55)); }
.content { position: relative; z-index: 1; padding: 32px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
h1 { font-family: "Helvetica", Arial, sans-serif; font-weight: 700; font-size: 36px; line-height: 1.05; margin: 0 0 8px; }
p { margin: 0; font-size: 16px; opacity: .9; }
.logo { position: absolute; bottom: 24px; left: 32px; font-weight: 700; font-size: 14px; }
</style>
</head>
<body>
<div class="post">
  <div class="scrim"></div>
  <div class="content">
    <h1>Track further.<br>Stay connected.</h1>
    <p>Turbo GPS · Field Marshall</p>
  </div>
  <div class="logo">MARSHALL RADIO</div>
</div>
</body>
</html>
